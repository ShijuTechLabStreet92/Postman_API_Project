name: Postman API CI

on:
  push:
    branches:
      - main

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Newman
        run: npm install -g newman

      - name: Run GoRest Collection
        run: newman run GoRest_Collection/Gorest_API.postman_collection.json -e GoRest_Collection/QA_Env.postman_environment.json

      - name: Run Swagger PET Collection
        run: newman run Swagger_PET_XMLCollection/Swagger_Pet_API_Xml.postman_collection.json

      - name: Run Swagger PET Collection
        run: newman run Swagger_USER_Collection/Swagger_User_API.postman_collection.json
